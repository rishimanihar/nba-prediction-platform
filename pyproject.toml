[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-prediction-platform"
version = "0.1.0"
description = "An end-to-end NBA game prediction platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
training = [
  "matplotlib>=3.8",
  "nba_api>=1.4",
  "xgboost>=3.2,<3.3",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
